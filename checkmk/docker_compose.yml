# checkmk/docker_compose.yml — Portainer GitOps stack, target: optiplex-two
services:
  checkmk:
    # Pinned patch: site restores need the same version, and 2.5.0-latest updated itself on redeploy.
    # Must stay >= 2.5.0p9 (CVE-2026-8593). Bump deliberately: take an omd backup first.
    image: checkmk/check-mk-community:2.5.0p17
    container_name: checkmk
    restart: unless-stopped
    environment:
      CMK_SITE_ID: cmk                     # URL becomes /cmk/
      CMK_PASSWORD: ${CMK_PASSWORD}        # set in Portainer stack env, not in Git
      # Eastern time. Must not contain "_": the 2.5.0 entrypoint runs sed "s_^TZ=.*_TZ=\"$TZ\"_"
      # on every restart, so America/New_York crash-loops the container.
      TZ: America/Detroit
    ports:
      - "8081:5000"                        # Web UI; Traefik on smiddleware proxies checkmk.shome here (not 8080: kubectl's localhost default)
      - "8000:8000"                        # Agent Receiver (TLS registration); agents connect directly
    volumes:
      - checkmk-sites:/omd/sites           # all site data; include in Borg backups
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000   # vendor-recommended; keeps temp churn off NVMe
    ulimits:
      nofile: 1024                         # vendor-recommended ulimit
    deploy:
      resources:
        limits:
          # Steady load is ~0.6-0.9 cores, but 2.0 was too tight: bursts of discovery checks hit the
          # cap, checks timed out (60 s) and re-ran, and the site stayed pinned (2026-10-22).
          # 3.0 leaves burst headroom; still below the 4 cores so K3s pods aren't starved.
          cpus: "3.0"
          memory: 4g

volumes:
  checkmk-sites: