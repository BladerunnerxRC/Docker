# docker/checkmk/compose.yaml — Portainer GitOps stack, target: optiplex-two
services:
  checkmk:
    # Pin to a specific patch (e.g. 2.5.0pNN) after first pull for reproducible GitOps
    image: checkmk/check-mk-community:2.5.0-latest
    container_name: checkmk
    restart: unless-stopped
    environment:
      CMK_SITE_ID: cmk                     # URL becomes /cmk/
      CMK_PASSWORD: ${CMK_PASSWORD}        # set in Portainer stack env, not in Git
      TZ: America/New_York
    ports:
      - "8080:5000"                        # Web UI; Traefik on smiddleware proxies checkmk.shome here
      - "8000:8000"                        # Agent Receiver (TLS registration); agents connect directly
    volumes:
      - checkmk-sites:/omd/sites           # all site data; include in Borg backups
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000   # vendor-recommended; keeps temp churn off NVMe
    ulimits:
      nofile: 1024                         # vendor-recommended ulimit
    deploy:
      resources:
        limits:
          cpus: "2.0"                      # cap so K3s pods on this node aren't starved
          memory: 4g

volumes:
  checkmk-sites: