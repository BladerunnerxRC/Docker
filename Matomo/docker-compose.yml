# Matomo — self-hosted web analytics (Google Analytics alternative).
#
# Three services:
#   matomo       official matomo:apache image, published through the existing Traefik
#   matomo-db    MariaDB 11, internal network only, no published port
#   matomo-cron  same image, runs `core:archive` on a loop so reports are pre-built
#
# Joins the existing external `edge` network created by the traefik stack. No host
# ports are published — ingress is via Traefik only.
#
# After the web installer finishes there are a few config.ini.php settings that MUST
# be applied (proxy headers, https, browser archiving). See README.md ->
# Post-install configuration. Skipping them logs every visit with Traefik's IP.

services:
  matomo:
    # Pinned to a MAJOR version. Note: bumping this tag does NOT upgrade Matomo itself.
    # The entrypoint copies the app into the matomo_html volume only when it is empty,
    # so after first run the code in the volume is what runs. Upgrade Matomo through
    # its own updater — see README.md -> Upgrades. The tag only moves PHP/Apache.
    image: matomo:5-apache
    container_name: matomo
    restart: unless-stopped

    environment:
      # Pre-fills the installer's database step. Host must match the db container_name.
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: "${MARIADB_USER}"
      MATOMO_DATABASE_PASSWORD: "${MARIADB_PASSWORD}"
      MATOMO_DATABASE_DBNAME: "${MARIADB_DATABASE}"
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-512M}"
      TZ: "${TZ:-UTC}"

    volumes:
      # Whole web root: app code, config/config.ini.php, installed plugins, tmp/.
      - matomo_html:/var/www/html

    networks:
      - edge          # reachable by Traefik
      - matomo-back   # reaches MariaDB; internal-only

    depends_on:
      matomo-db:
        condition: service_healthy

    labels:
      - "traefik.enable=true"
      # This container sits on two networks; tell Traefik which IP to route to.
      - "traefik.docker.network=edge"

      - "traefik.http.routers.matomo.rule=Host(`${MATOMO_HOST}.${BASE_DOMAIN}`)"
      - "traefik.http.routers.matomo.entrypoints=websecure"
      - "traefik.http.routers.matomo.tls=true"
      - "traefik.http.routers.matomo.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.routers.matomo.service=matomo"
      - "traefik.http.services.matomo.loadbalancer.server.port=80"

      # Matomo has its own login, so no BasicAuth here — it would also break the
      # JS tracker, which visitors' browsers call anonymously. The allowlist decides
      # who can reach Matomo AT ALL, including tracking; widen it to cover every
      # client whose visits you want recorded. See README.md -> Security.
      - "traefik.http.routers.matomo.middlewares=matomo-ipallow@docker,security-headers@file,compression@file"
      - "traefik.http.middlewares.matomo-ipallow.ipallowlist.sourcerange=${MATOMO_ALLOWLIST:-192.168.200.0/24,192.168.0.0/16}"

    healthcheck:
      # Any HTTP response from Apache counts (no -f): before the installer runs, /
      # answers with the installer page, and after it with a login redirect.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # Hardening. The apache image starts as root, the entrypoint chowns the web root
    # on first run, then Apache binds :80 and drops to www-data — hence this cap set.
    # KILL lets the root Apache master signal its www-data workers on reload/stop.
    # If the container ever crash-loops with permission errors, drop cap_drop/cap_add
    # first.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL

    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  matomo-cron:
    # Same image and volume as the app, so the archiver always runs the same code.
    image: matomo:5-apache
    container_name: matomo-cron
    restart: unless-stopped
    user: www-data
    init: true   # lets `docker stop` interrupt the sleep instead of waiting 10s for SIGKILL
    # The apache image sets STOPSIGNAL SIGWINCH (Apache's graceful stop). The shell loop
    # here ignores SIGWINCH, so without this every stop ends in a SIGKILL (exit 137).
    stop_signal: SIGTERM

    # --url is the PUBLIC Matomo URL. This container never connects to it: the image
    # supports async CLI archiving ("Async process archiving supported, using CliMulti"
    # in the log), so reports are built in local sub-processes. Matomo uses the URL to
    # build links, e.g. in scheduled email reports sent from inside core:archive.
    #
    # Don't swap it for the internal http://matomo/ name: that requires adding
    # "matomo" to trusted_hosts, and Matomo then rewrites its stored URL — the one shown
    # in the tracking-code snippet — to https://matomo/ whenever anything hits it by
    # that name.
    #
    # Fails noisily (and harmlessly) until the web installer has been completed.
    entrypoint: ["sh", "-c"]
    command:
      - |
        while :; do
          php /var/www/html/console core:archive --url=https://${MATOMO_HOST}.${BASE_DOMAIN}/ \
            || echo "core:archive exited $$? - retrying in ${ARCHIVE_INTERVAL:-3600}s"
          sleep ${ARCHIVE_INTERVAL:-3600}
        done

    environment:
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-512M}"
      TZ: "${TZ:-UTC}"

    volumes:
      - matomo_html:/var/www/html

    networks:
      - matomo-back   # reaches MariaDB; not on `edge`

    depends_on:
      # Healthy app = entrypoint has finished populating matomo_html.
      matomo:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  matomo-db:
    image: mariadb:11
    container_name: matomo-db
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      # mariadb:11 floats across 11.x minors; upgrade the system tables on start.
      MARIADB_AUTO_UPGRADE: "1"
      TZ: "${TZ:-UTC}"

    command:
      # Matomo's recommended packet size; the default 16M can fail on large archives.
      - --max-allowed-packet=64M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-512M}

    volumes:
      # Local disk on the Docker host — InnoDB over NFS risks corruption.
      - matomo_db:/var/lib/mysql

    networks:
      - matomo-back   # not on `edge`; nothing outside this stack can reach it

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Minimum set for the entrypoint to initialize/own the data dir and drop to mysql.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    # Give InnoDB time for a clean shutdown rather than crash recovery.
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Backups are NOT handled by this stack. Borg drives them: it calls
# borg-prep-matomo.sh on the host, which dumps the DB and the web root to
# /var/backups/borg-matomo/latest for Borg to archive. See the README.

volumes:
  matomo_html:
  matomo_db:

networks:
  # Created by the traefik stack. Declared external so this stack never owns or
  # removes it — bringing this stack down must not touch the edge network.
  edge:
    external: true
    name: edge

  # App/cron <-> MariaDB only. internal:true removes the gateway, so nothing on it
  # has a route off the host in either direction.
  matomo-back:
    driver: bridge
    internal: true
