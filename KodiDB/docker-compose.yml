services:
  mariadb-kodi:
    image: mariadb:11
    container_name: mariadb-kodi
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - kodi-db-data:/var/lib/mysql                  # persistent DB storage (local disk)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

# Backups are NOT handled by this stack. Borg drives them: it calls
# borg-prep-kodidb.sh on the host, which dumps the DB to /var/backups/borg-kodidb/latest
# and lets Borg archive, deduplicate, and prune. See the README.

volumes:
  # DB data on the Docker host's local disk (safe for InnoDB).
  # Docker-managed named volume lives under /var/lib/docker/volumes/.
  kodi-db-data:
