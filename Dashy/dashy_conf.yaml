        icon: far fa-book
        url: https://dashy.to/docs
        target: newtab
        provider: Dashy.to
        id: 0_1481_docs
      - title: GitHub
        description: Source Code, Issues and Pull Requests
        icon: si-github
        url: https://github.com/lissy93/dashy
        target: newtab
        id: 1_1481_github
  - name: Testing Widgets
    displayData:
      rows: 4
      cols: 3
      collapsed: true
    widgets:
      - type: clock
        updateInterval: 2
        useProxy: false
        options:
          timeZone: America/New_York
          hidedata: false
          format: en-US
          hideSeconds: true
          use12Hour: true
        id: 0_1493_clock
      - type: joke
        updateInterval: 1800
        useProxy: false
        id: 1_1493_joke
      - type: xkcd-comic
        useProxy: false
        options:
          comic: random
        id: 2_1493_xkcdcomic
    items: []
  - name: Experimentation
    displayData:
      collapsed: true
      rows: 2
      cols: 2
    items:
