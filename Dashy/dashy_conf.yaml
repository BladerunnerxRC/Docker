appConfig:
  theme: glass
  language: en
  iconSize: large
  layout: horizontal
  enableMaterialDesignIcons: true
  enableFontAwesome: false
pageInfo:
  title: Smith Network Dashboard
  description: Welcome Human!
  navLinks:
    - title: GitHub
      path: https://github.com/Lissy93/dashy
    - title: Documentation
      path: https://dashy.to/docs
sections:
  - name: Applications
    icon: >-
      https://cdn.jsdelivr.net/npm/@lobehub/icons-static-png@latest/dark/replit-color.png
    displayData:
      sortBy: alphabetical
      rows: 3
      cols: 4
      collapsed: true
    items:
      - title: Smith Family Photos
        description: Synology Photos on SMITHVAULT
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/synology-photos.png
        url: >-
          http://192.168.200.3:5000/?launchApp=SYNO.Foto.AppInstance#/shared_space/folder/1
        target: newtab
        id: 0_1255_smithfamilyphotos
      - title: Komga
        description: Comic Book Reader
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/komga.png
        url: https://komga.shome
        target: newtab
        id: 1_1255_komga
      - title: Meshy
        description: AI 3D Model Creation (Online)
        icon: >-
          https://cdn.jsdelivr.net/npm/@lobehub/icons-static-png@latest/dark/meshy-color.png
        url: https://www.meshy.ai/discover
        target: newtab
        id: 2_1255_meshy
      - title: OnShape
        description: Online Web CAD
        icon: >-
          https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/onshape-dark.png
        url: https://cad.onshape.com/
        target: newtab
        id: 3_1255_onshape
      - title: GitHub
        description: My GitHub Page
        icon: >-
          https://cdn.jsdelivr.net/npm/@lobehub/icons-static-png@latest/dark/github.png
        url: https://github.com/
        target: newtab
        id: 4_1255_github
      - title: Manyfold
        description: STL catalog and viewer
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/manyfold.png
        url: https://manyfold3d.shome/dashboard
        target: newtab
        id: 5_1255_manyfold
      - title: Gmail
        description: tasmith2@gmail.com
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/gmail.png
        url: https://mail.google.com/
        target: newtab
        id: 6_1255_gmail
