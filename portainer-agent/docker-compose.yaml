services:
  portainer_agent:
    # Must match the Portainer server version (shown bottom-left in the Portainer UI).
    image: portainer/agent:${AGENT_VERSION:?set AGENT_VERSION to the Portainer server version}
    container_name: portainer_agent
    restart: always
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
