services:
  portainer_agent:
    image: portainer/agent:<your-server-version>
    container_name: portainer_agent
    restart: always
    ports:
      - "9001:9001"
    environment:
      - AGENT_SECRET=${AGENT_SECRET}   # optional shared secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
      
