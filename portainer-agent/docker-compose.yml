services:
  portainer_agent:
    # The sync script replaces this tag with the Portainer server's version.
    # It is used only with --force when the server cannot be reached.
    image: portainer/agent:2.45.4
    container_name: portainer_agent
    restart: always
    ports:
      - "9001:9001"
    environment:
      - AGENT_SECRET=${AGENT_SECRET:-}   # optional shared secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host   # host file browser (Host > Setup); remove to keep the agent out of the host filesystem
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
