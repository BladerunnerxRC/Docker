# SearXNG limiter / bot-detection tuning for this stack.
# Only read when the limiter is enabled (SEARXNG_LIMITER=true in
# docker-compose.yml). Reference: https://docs.searxng.org/admin/searx.limiter.html

[botdetection]

# Leading bits compared to decide whether two request IPs belong to the same
# client network (one rate-limit bucket per network). 32/48 means every IPv4
# host / IPv6 /48 gets its own bucket.
ipv4_prefix = 32
ipv6_prefix = 48

# Proxies whose X-Forwarded-For / X-Real-IP headers are trusted for the real
# client IP. Loopback only for now — the stack publishes port 8888 directly,
# so LAN clients normally retain their source address. Container NAT/proxy
# paths can differ: verify the address seen from the actual MCP client.
# If using Traefik, add only its actual IP or dedicated proxy subnet here;
# do not trust every Docker network to supply forwarding headers.
trusted_proxies = [
  '127.0.0.0/8',
  '::1',
  # Add the actual reverse proxy address here when deploying one.
]

[botdetection.ip_limit]

# Keep link-local addresses monitored like everything else (default).
filter_link_local = false

# Require clients to fetch a CSS-delivered token before /search is accepted —
# defeats simple scripted scrapers that never load page assets. Trusted LAN
# clients bypass this via pass_ip below, so JSON-API consumers on the LAN
# (e.g. LLM/search integrations) are unaffected.
link_token = true

[botdetection.ip_lists]

# pass_ip has priority over every other bot-detection method: listed networks
# get unrestricted access, including the JSON API. The home LAN is trusted;
# tighten to specific hosts or remove if the instance is ever exposed wider.
pass_ip = [
  # Real LAN clients (browsers on laptops/phones).
  '192.168.200.0/24',
  # The searxng_net bridge, pinned to this subnet in docker-compose.yml.
  # Covers MCP consumers attached to this network. Clients on another bridge,
  # behind NAT, or behind a proxy may present a different source address.
  # Verify from the actual client before adding a narrow passlist entry.
  # Non-passlisted JSON clients are subject to bot checks and API rate limits.
  '172.30.0.0/24',
]

block_ip = [
  # '203.0.113.0/24',  # example: persistent scraper network
]

# Don't let the SearXNG org's checker IPs (check.searx.space) bypass the
# limiter — this is a private instance, not a listed public one.
pass_searxng_org = false
