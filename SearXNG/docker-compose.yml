services:
  searxng:
    # Pinned: upstream publishes ~3 dated builds a day, so `latest` moves under
    # you on every redeploy. Re-resolve with:
    #   docker buildx imagetools inspect searxng/searxng:<tag>
    image: searxng/searxng:2026.9.3-a1144dda3@sha256:3602e6ddbeba037f5d800d1ed9d296a8b93c9f5b3cf9d05fa179d0e766dd59a1
    container_name: searxng
    restart: unless-stopped

    ports:
      # Bound to one LAN address rather than every host interface, matching
      # the other stacks in this repo.
      - "192.168.200.14:8888:8080"

    volumes:
      - searxng_config:/etc/searxng:rw
      # rw (not ro): the entrypoint chowns everything under /etc/searxng and
      # would fail on a read-only mount.
      - searxng_cache:/var/cache/searxng:rw

    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://192.168.200.14:8888/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in the stack environment}
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
      # Enables the limiter regardless of what settings.yml says; tuning lives
      # in limiter.toml.
      SEARXNG_LIMITER: "true"

    depends_on:
      valkey:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      # The entrypoint runs as root: it chowns the volumes to searxng (CHOWN),
      # then writes settings.yml into the searxng-owned dir (DAC_OVERRIDE).
      - CHOWN
      - DAC_OVERRIDE

    mem_limit: 1g
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - searxng_net

  valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    restart: unless-stopped

    # --save "": this holds limiter counters and cache, all reconstructible.
    # RDB snapshots fork the process, and the copy-on-write spike inside the
    # 256m cap is the classic way this container gets OOM-killed.
    # --maxmemory: valkey cannot see mem_limit, so without it the dataset
    # grows until the kernel kills the container instead of evicting.
    command: >
      valkey-server --save "" --appendonly no
      --maxmemory 192mb --maxmemory-policy allkeys-lru
      --loglevel warning

    volumes:
      - searxng_valkey_data:/data

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    mem_limit: 256m
    mem_reservation: 64m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - searxng_net

volumes:
  searxng_config:
    name: searxng_config
  searxng_cache:
    name: searxng_cache
  searxng_valkey_data:
    name: searxng_valkey_data

networks:
  searxng_net:
    driver: bridge
    # Fixed subnet so limiter.toml's pass_ip can name it exactly. Without a
    # pinned subnet Docker allocates from 172.16/12 arbitrarily and the
    # passlist entry would have to blanket-trust the whole range.
    ipam:
      config:
        - subnet: 172.28.0.0/24
