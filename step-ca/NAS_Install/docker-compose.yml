services:
  stepca:
    image: smallstep/step-ca:latest
    container_name: step-ca
    restart: unless-stopped

    # NEW: make step-ca use AdGuard DNS so *.shome resolves (fixes NXDOMAIN)
    dns:
      - 192.168.200.52

    ports:
      - "9000:9000"      # LAN only; do NOT port-forward
    environment:
      DOCKER_STEPCA_INIT_NAME: "SHOME LAN CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "ca.shome,192.168.200.3"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: "admin"
    volumes:
      - /volume1/docker/stepca:/home/step