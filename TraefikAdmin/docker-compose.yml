# Traefik Proxy Admin — web UI that feeds routes to your EXISTING Traefik over the
# HTTP provider. It does not run, replace, or restart Traefik.
#
# Adapted from upstream docker.compose.example.yml:
#   - no Traefik container here, nothing bound to :80/:443
#   - joins the existing external `edge` network (upstream assumed a network named `traefik`)
#   - middlewares renamed to the ones this repo actually defines — security-headers@file
#     and compression@file — plus its own BasicAuth + IP-allowlist pair. Upstream's
#     `security@file`, `base@file` and `auth-traefik@docker` (authentik) do not exist here.
#   - Postgres pinned to an internal-only network, no published port, no route
#
# The app has NO built-in login. The middlewares below are the only thing standing
# between the LAN and full CRUD over your routing table. See README.md -> Security.

services:
  traefik-proxy-admin:
    # Built from source, because the host (smiddleware) is a Raspberry Pi 5 / arm64 and
    # upstream publishes linux/amd64 ONLY — with no manifest list, so the pull would
    # succeed and the container then restart-loop on
    # "exec ./entrypoint.sh: exec format error".
    #
    # LOCALLY BUILT IMAGE — build it before deploying, or this stack fails with
    # "image not found". One command, documented in README.md -> Non-amd64 hosts:
    #
    #   git clone https://github.com/Janhouse/traefik-proxy-admin.git /opt/build/traefik-proxy-admin
    #   cd /opt/build/traefik-proxy-admin && git checkout 74f39a389a5a
    #   docker build -t traefik-proxy-admin:main-74f39a38 .
    #
    # There is deliberately no `build:` block here. The build needs a context with a real
    # .git directory — next.config.ts derives the Next.js build ID by shelling out to
    # `git describe`/`git rev-parse` and throws if both fail. A `build.context` pointing at
    # a git URL exports the tree WITHOUT .git, so it fails at `pnpm build` with
    # "fatal: not a git repository". Hence a plain clone and a pre-built image.
    #
    # Pinned to a main COMMIT rather than the v0.2.2 tag: that tag's Dockerfile (Dec 2025)
    # installs pnpm unpinned and predates pnpm-workspace.yaml, so it now dies with
    # ERR_PNPM_IGNORED_BUILDS. Upstream fixed it on main (6f734dfbb1, dd910142b6) but
    # never cut a new tag; their own :latest is likewise built from main.
    #
    # On an amd64 host none of this applies — delete this comment and use the published
    # image instead:
    #   image: ghcr.io/janhouse/traefik-proxy-admin:v0.2.2
    image: traefik-proxy-admin:main-74f39a38
    container_name: traefik-proxy-admin
    restart: unless-stopped

    environment:
      # DATABASE_URL is the only variable the app requires. Host must match the db
      # service's container_name below. Password must be alphanumeric — see .env.example.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@traefik-proxy-admin-db:5432/${POSTGRES_DB}"
      DB_CONNECTION_LIMIT: "${DB_CONNECTION_LIMIT:-10}"
      TZ: "${TZ:-UTC}"

    networks:
      - edge          # reachable by Traefik for routing + HTTP-provider polling
      - tpadmin-back  # reaches Postgres; internal-only

    depends_on:
      traefik-proxy-admin-db:
        condition: service_healthy

    # No ports published — ingress is via Traefik only.
    #
    # The 3000 below is the CONTAINER's listener, not a host port. It does not
    # conflict with AdGuard Home, which already owns host :3000 in the traefik
    # stack: Traefik dials this container's `edge` IP on 3000, a different address
    # from 0.0.0.0:3000 on the host. Nothing here needs a free host port.
    #
    # The container IS reachable on :3000 by anything else on `edge` — inherent to
    # the shared network, see README.md -> Security.

    labels:
      - "traefik.enable=true"
      # This container sits on two networks; tell Traefik which IP to route to.
      - "traefik.docker.network=edge"

      - "traefik.http.routers.tpadmin.rule=Host(`${TPADMIN_HOST}.${BASE_DOMAIN}`)"
      - "traefik.http.routers.tpadmin.entrypoints=websecure"
      - "traefik.http.routers.tpadmin.tls=true"
      - "traefik.http.routers.tpadmin.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.routers.tpadmin.service=tpadmin"
      - "traefik.http.services.tpadmin.loadbalancer.server.port=3000"

      # Order matters: reject off-subnet callers before spending a bcrypt compare.
      - "traefik.http.routers.tpadmin.middlewares=tpadmin-ipallow@docker,tpadmin-auth@docker,security-headers@file,compression@file"

      # Own middleware pair rather than borrowing traefik-auth@docker / traefik-ipallow@docker
      # from the traefik stack — those vanish if that stack is redeployed, which would
      # silently drop auth from this router.
      - "traefik.http.middlewares.tpadmin-ipallow.ipallowlist.sourcerange=${TPADMIN_ALLOWLIST:-192.168.200.0/24,192.168.0.0/16}"
      # usersfile path is resolved inside the TRAEFIK container, which already mounts
      # /opt/netlab-stack/traefik/auth/.htpasswd there. Nothing to mount here.
      - "traefik.http.middlewares.tpadmin-auth.basicauth.usersfile=/etc/traefik/.htpasswd"
      - "traefik.http.middlewares.tpadmin-auth.basicauth.removeheader=true"

    # Hardening. The image already runs as uid 1001 and needs no capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Next.js standalone writes its fetch/ISR cache here — the upstream Dockerfile
      # creates and chowns this path explicitly. If the container ever crash-loops on
      # a read-only filesystem, drop `read_only` and these two tmpfs lines first.
      - /app/.next/cache:rw,noexec,nosuid,size=128m,mode=1777
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 20s

    # The image ships its own HEALTHCHECK (wget --spider on /api/health, 10s interval),
    # so none is declared here. Note it probes the HTTP listener only — it stays green
    # if Postgres is unreachable.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik-proxy-admin-db:
    image: postgres:16-alpine
    container_name: traefik-proxy-admin-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Detects silent on-disk corruption. Only applied when the volume is first created.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: "${TZ:-UTC}"

    volumes:
      - tpadmin_db_data:/var/lib/postgresql/data

    networks:
      - tpadmin-back  # not on `edge`; nothing outside this stack can reach it

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Minimum set for initdb to create and own the data directory.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    shm_size: 128mb
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    # Give Postgres time to complete a clean shutdown rather than a crash recovery.
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tpadmin_db_data:

networks:
  # Created by the traefik stack. Declared external so this stack never owns or
  # removes it — bringing this stack down must not touch the edge network.
  edge:
    external: true
    name: edge

  # App <-> Postgres only. internal:true removes the gateway, so the DB has no
  # route off the host in either direction.
  tpadmin-back:
    driver: bridge
    internal: true
