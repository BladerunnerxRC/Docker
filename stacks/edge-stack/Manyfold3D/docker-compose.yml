services:
  app:
    image: ghcr.io/manyfold3d/manyfold:latest
    ports:
      - "3214:3214"
    volumes:
      - ${MANYFOLD_LIB_PATH}:/libraries
    environment:
      DATABASE_ADAPTER: "postgresql"
      DATABASE_HOST: "postgres-manyfoldsvr"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "${POSTGRES_DB}"
      DATABASE_USER: "${POSTGRES_USER}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      REDIS_URL: "redis://redis-manyfoldsvr:6379/1"
      PUID: "${PUID}"
      PGID: "${PGID}"
    restart: unless-stopped
    depends_on:
      postgres-manyfoldsvr:
        condition: service_healthy
      redis-manyfoldsvr:
        condition: service_healthy
    networks:
      - manyfold
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "s=TCPSocket.new('127.0.0.1',3214);s.close;exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-manyfoldsvr:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    restart: unless-stopped
    networks:
      - manyfold
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-manyfoldsvr:
    image: redis:7
    restart: unless-stopped
    networks:
      - manyfold
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:

networks:
  manyfold:
