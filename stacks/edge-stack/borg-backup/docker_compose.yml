services:
  borg-ui:
    image: ainullcode/borg-ui:latest
    container_name: borg-backup

    environment:
      TZ: America/New_York
      PORT: "8081"
      PUID: "1024"
      PGID: "100"
      LOCAL_MOUNT_POINTS: "/local,/restore"

      # Redis-backed archive cache for faster archive browsing.
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    ports:
      - "8888:8081"

    volumes:
      - borgui_data:/data
      - borgui_cache:/home/borg/.cache/borg

      - /srv/borg-source:/source/data:ro
      - /opt/borg-ui-empty:/source/empty:ro

      - /mnt/backups/borgrepo:/local/shared:rw
      - /mnt/borg_smiddleware:/local/smiddleware:rw

      - /srv/borg-restore:/restore:rw

      - /var/log/borg:/logs:ro

      - /srv/borg-ui-config-export:/local/borgui-config-export:rw
      - borgui_data:/local/borgui-data:ro

    labels:
      - "wud.watch=true"
      - "wud.tag.include=latest"
      - "wud.watch.digest=true"

    devices:
      - /dev/fuse:/dev/fuse

    cap_add:
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    # Give in-flight borg create/compact/prune operations time to finish
    # cleanly on stop/restart instead of being SIGKILLed mid-operation.
    stop_grace_period: 120s

    mem_limit: 4g
    memswap_limit: 5g
    cpus: "2.0"
    pids_limit: 512

    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8081)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: borg-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - borgui_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

    mem_limit: 768m
    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  borgui_data:
  borgui_cache:
  borgui_redis:
