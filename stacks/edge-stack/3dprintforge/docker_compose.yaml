version: "3.8"

services:
  3dprintforge:
    image: ghcr.io/skynett81/3dprintforge:latest
    container_name: 3dprintforge
    network_mode: host
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      BAMBU_IP: ${BAMBU_IP}
      BAMBU_SERIAL: ${BAMBU_SERIAL}
      BAMBU_ACCESS_CODE: ${BAMBU_ACCESS_CODE}

    volumes:
      - /opt/stacks/3dprintforge/data:/app/data
      - /opt/stacks/3dprintforge/config.json:/app/config.json
      - /opt/stacks/3dprintforge/certs:/app/certs

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
