http:
  routers:
    dockhand:
      rule: "Host(`dockhand.shome`)"
      entryPoints: ["websecure"]
      tls:
        certResolver: stepca
      middlewares: ["security-headers", "compression"]
      service: dockhand

    grafana:
      rule: "Host(`grafana.shome`)"
      entryPoints: ["websecure"]
      tls:
        certResolver: stepca
      middlewares: ["security-headers", "compression"]
