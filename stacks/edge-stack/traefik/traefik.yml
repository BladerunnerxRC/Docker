api:
  dashboard: true
  insecure: true

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8082"
    
providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  stepca:
    acme:
      email: admin@shome
      storage: /etc/traefik/acme/acme.json
      caServer: https://stepca.shome:9000/acme/acme/directory
      tlsChallenge: {}

