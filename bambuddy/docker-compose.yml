services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:0.2.2b2
    container_name: bambuddy
    hostname: bambuddy
    init: true
    network_mode: host

    cap_add:
      - NET_BIND_SERVICE

    environment:
      TZ: America/New_York
      PORT: "21000"
      DEBUG: "false"
      LOG_LEVEL: INFO

    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bambuddy_data:
    name: bambuddy_data
  bambuddy_logs:
    name: bambuddy_logs